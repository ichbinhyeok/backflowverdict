<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img" aria-labelledby="title desc">
<title id="title">How to read a device label</title><desc id="desc">An example label with separate manufacturer, full model and nominal-size fields. This is a teaching example, not a real manufacturer's label.</desc>
<rect width="680" height="280" fill="#eceee3"/>
<rect x="38" y="34" width="604" height="210" rx="10" fill="#fcfbf4" stroke="#97a58c"/>
<g fill="#b5bea9"><circle cx="53" cy="49" r="4"/><circle cx="627" cy="49" r="4"/><circle cx="53" cy="229" r="4"/><circle cx="627" cy="229" r="4"/></g>
<text x="70" y="73" fill="#63735b" font-family="monospace" font-size="13" letter-spacing="2">EXAMPLE LABEL / READ THE MARKINGS</text>
<path d="M70 92H610" stroke="#c5cebc"/>
<text x="70" y="120" fill="#65715e" font-family="sans-serif" font-size="12">MANUFACTURER</text><text x="70" y="151" fill="#263e2b" font-family="sans-serif" font-size="22">Read the actual name</text>
<rect x="327" y="105" width="170" height="92" fill="#e1e8d7"/>
<text x="339" y="124" fill="#4c674b" font-family="sans-serif" font-size="12">MODEL + SUFFIX</text><text x="339" y="158" fill="#1d503b" font-family="monospace" font-size="26" font-weight="bold">975XL2</text>
<rect x="516" y="105" width="94" height="92" fill="#e1e8d7"/>
<text x="528" y="124" fill="#4c674b" font-family="sans-serif" font-size="12">SIZE</text><text x="528" y="158" fill="#1d503b" font-family="monospace" font-size="26" font-weight="bold">1 IN</text>
<text x="70" y="220" fill="#63735b" font-family="sans-serif" font-size="12">Keep every suffix. Nominal size is not the pipe's outside diameter.</text>
</svg>
